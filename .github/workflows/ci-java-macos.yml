name: Java CI (macOS 26)

on:
  push:
    branches: [ "main" ]
  # Docs-only PRs start no CI.
  pull_request:
    paths:
      - '**'
      - '!**/*.md'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build-against-installed-gempba:
    runs-on: ${{ fromJSON(vars.RUNNER_MACOS_INTEL || '["macos-26-intel"]') }}
    timeout-minutes: 45
    env:
      GEMPBA_OWNER: ${{ vars.GEMPBA_OWNER || github.repository_owner }}
      GEMPBA_CROSS_REPO_TOKEN: ${{ secrets.GEMPBA_CROSS_REPO_TOKEN || '' }}

    steps:
      # Stale .git locks left by a prior cancelled run break actions/checkout on
      # long-lived self-hosted macOS runners.
      - name: Clean stale .git locks from prior interrupted runs
        shell: bash
        run: |
          if [ -d "$GITHUB_WORKSPACE/.git" ]; then
            find "$GITHUB_WORKSPACE/.git" -name '*.lock' -delete 2>/dev/null || true
          fi

      # 1️⃣ Checkout this repo
      - name: Checkout gempba-java-examples
        uses: actions/checkout@v6
        with:
          ref: ${{ github.ref }}

      # 1️⃣b Bootstrap Homebrew on PATH (self-hosted runners don't source the user
      # profile in non-interactive shells, so brew may exist on disk but not on PATH).
      - name: Bootstrap Homebrew on PATH
        run: |
          if [ -x /opt/homebrew/bin/brew ]; then
            BREW_PREFIX=/opt/homebrew
          elif [ -x /usr/local/bin/brew ]; then
            BREW_PREFIX=/usr/local
          else
            echo "Homebrew not found at /opt/homebrew or /usr/local. Install it on the runner first." >&2
            exit 1
          fi
          echo "$BREW_PREFIX/bin" >> "$GITHUB_PATH"
          echo "$BREW_PREFIX/sbin" >> "$GITHUB_PATH"
          eval "$($BREW_PREFIX/bin/brew shellenv)"
          brew --version

      # 2️⃣ Install dependencies. Both JAR variants build in this job, so
      #    open-mpi is always needed (the mp-mpi native links it). See gempba#239.
      - name: Setup Dependencies
        env:
          HOMEBREW_NO_AUTO_UPDATE: '1'
        run: |
          brew install cmake pkg-config boost spdlog fmt hwloc open-mpi

      - name: Setup JDK 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      - name: Echo versions
        run: |
          echo "clang++: $(clang++ --version | head -1)"
          echo "cmake: $(cmake --version | head -1 | awk '{print $3}')"
          echo "java: $(java -version 2>&1 | head -1)"
          echo "mvn: $(mvn -v | head -1)"

      # 3️⃣ Resolve sister-repo branch (same-name, fall back to main)
      - name: Resolve gempba ref
        id: gempba_ref
        run: |
          # Override any extraheader/credential helper set by actions/checkout
          # (v6 writes the GITHUB_TOKEN auth header to a separate config file
          # that --local --unset-all cannot reach, so the URL-embedded PAT was
          # being shadowed). -c clears them for THIS command only.
          if [ -n "$GEMPBA_CROSS_REPO_TOKEN" ]; then
            GEMPBA_URL="https://x-access-token:${GEMPBA_CROSS_REPO_TOKEN}@github.com/${GEMPBA_OWNER}/gempba.git"
          else
            GEMPBA_URL="https://github.com/${GEMPBA_OWNER}/gempba.git"
          fi
          BRANCH="${{ github.head_ref || github.ref_name }}"
          set +e
          LS_OUTPUT=$(git -c http."https://github.com/".extraheader= -c credential.helper= ls-remote --exit-code --heads "$GEMPBA_URL" "$BRANCH" 2>&1)
          LS_EXIT=$?
          set -e
          if [ "$LS_EXIT" = "0" ]; then
            echo "ref=$BRANCH" >> "$GITHUB_OUTPUT"
            echo "Picked sister branch '$BRANCH' from $GEMPBA_OWNER/gempba"
          elif [ "$LS_EXIT" = "2" ]; then
            echo "ref=main" >> "$GITHUB_OUTPUT"
            echo "Sister branch '$BRANCH' not present in $GEMPBA_OWNER/gempba; falling back to main"
          else
            echo "::error::ls-remote against $GEMPBA_OWNER/gempba failed (exit $LS_EXIT)"
            echo "$LS_OUTPUT"
            exit "$LS_EXIT"
          fi

      # 4️⃣ Clone gempba and record the JAR version its bindings/java/pom.xml builds
      - name: Clone gempba
        run: |
          if [ -n "$GEMPBA_CROSS_REPO_TOKEN" ]; then
            GEMPBA_URL="https://x-access-token:${GEMPBA_CROSS_REPO_TOKEN}@github.com/${GEMPBA_OWNER}/gempba.git"
          else
            GEMPBA_URL="https://github.com/${GEMPBA_OWNER}/gempba.git"
          fi
          git -c http."https://github.com/".extraheader= -c credential.helper= clone --depth 1 --branch "${{ steps.gempba_ref.outputs.ref }}" \
            "$GEMPBA_URL" "$RUNNER_TEMP/gempba-src"
          GEMPBA_VERSION=$(grep -m1 '<version>' "$RUNNER_TEMP/gempba-src/bindings/java/pom.xml" | sed -E 's/[[:space:]]*<version>([^<]+)<\/version>.*/\1/')
          echo "GEMPBA_VERSION=$GEMPBA_VERSION" >> "$GITHUB_ENV"
          echo "gempba JAR version: $GEMPBA_VERSION"

      # 5️⃣ Build the MT and MP gempba JARs and mvn install them into ~/.m2,
      #    where this repo's io.gempba:gempba dependency resolves them. The
      #    static hwloc/fmt/spdlog prefix is cached under ~/.cache on the runner.
      - name: Install gempba JARs (mt + mp-mpi)
        run: bash "$RUNNER_TEMP/gempba-src/scripts/build_all_jars_macos.sh"

      # 6️⃣ Build and test every module against the installed gempba JARs
      - name: Build gempba-java-examples
        run: |
          mvn -B verify \
            -Dgempba.version="$GEMPBA_VERSION" \
            -Dgempba.github.owner="$GEMPBA_OWNER"

      # 7️⃣ Stress-test multithreaded and hybrid runs, oversubscribed. Each run times out on its own after 60 s.
      - name: Run the stress tests
        timeout-minutes: 10
        run: |
          mvn -B verify -Pstress -Dgempba.stress.repeat=3 \
            -Dgempba.version="$GEMPBA_VERSION" \
            -Dgempba.github.owner="$GEMPBA_OWNER"

      - name: Upload stress-test output
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: stress-logs-macos
          path: '*/target/stress-logs/*.log'
          if-no-files-found: ignore
